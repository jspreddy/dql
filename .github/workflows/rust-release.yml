name: Rust release
on:
  push:
    tags:
      - "rust-[0-9]+.[0-9]+.[0-9]+"
      - "rust-[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.d.outputs.has_rust }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - id: d
        run: |
          if [ -d rust-impl ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    env:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: us-west-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-impl

      - name: Install Java
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"

      - name: Install and start DynamoDB Local
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/install_dynamodb_local.sh background

      - name: Build release binary
        working-directory: rust-impl
        run: cargo build --release -p dql-cli

      - name: Run package smoke test
        env:
          DQL_REQUIRE_LOCAL: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: ./scripts/rust-smoke-test.sh

      - name: Package release archive
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          arch="$(uname -m)"
          asset="dqlrs-${version}-${{ matrix.target }}-${arch}.tar.gz"
          mkdir -p "dist/${version}"
          cp rust-impl/target/release/dqlrs "dist/${version}/dqlrs"
          cp LICENSE "dist/${version}/LICENSE"
          tar -czf "$asset" -C "dist/${version}" dqlrs LICENSE
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dqlrs-${{ matrix.target }}-${{ runner.arch }}
          path: dqlrs-*.tar.gz

  release:
    needs: build
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
