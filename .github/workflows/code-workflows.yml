name: Code workflows
on:
  push:
    branches:
      - 'v-next'
  pull_request:
    branches:
      - 'v-next'
jobs:
  lint-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run linting
        run: |
          uv run mypy dql tests bin/install.py
          uv run isort --skip snapshots --check dql tests bin/install.py
          uv run black --exclude=snapshots --check dql tests bin/install.py
          uv run pylint --rcfile=.pylintrc dql tests bin/install.py

  test-job:
    needs: lint-job
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9'] # TODO: add '3.10' and '3.11' once they are working.
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Install & start DynamoDB Local
        run: ./travisci/install_dynamodb_local.sh background

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests

