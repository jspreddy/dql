name: Check

# Run `just check` (Python and Rust lint, no edits) on every merge into v-rust.
on:
  push:
    branches: [v-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub's own checkout, pinned to a commit (the Actions policy requires pinned actions).
      # The job only reads, so it does not keep the token in .git/config.
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install just and uv
        run: |
          pipx install rust-just
          pipx install uv
          just --version
          uv --version

      # rust-impl/rust-toolchain.toml selects stable. rustfmt and clippy are what `just check` runs.
      - name: Install Rust components
        id: rust
        working-directory: rust-impl
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Cache keys use the dependencies in Cargo.lock without the workspace's own crates, whose
      # versions change on every release (scripts/cargo-deps-hash.sh).
      - name: Hash the dependencies
        id: deps
        # An assignment, so a failing script fails the step (echo "$(...)" would not).
        run: |
          hash=$(scripts/cargo-deps-hash.sh)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Downloaded crates, keyed on the dependencies. A dependency change starts from the last cache
      # and downloads only what is new. Shared with the other workflows on v-rust.
      - name: Cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ steps.deps.outputs.hash }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # Compiled dependencies for clippy, keyed on the compiler and the dependencies. No restore-keys:
      # a new compiler or dependency change builds once from scratch, so stale artifacts never pile up.
      # Workspace crates still rebuild every run; the dependencies are what this saves.
      - name: Cache the build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-impl/target
          key: cargo-target-check-${{ runner.os }}-${{ steps.rust.outputs.rustc }}-${{ steps.deps.outputs.hash }}

      - name: just check
        env:
          NO_COLOR: "1"
          # Incremental artifacts only help local rebuilds. Off, the cached build directory is smaller.
          CARGO_INCREMENTAL: "0"
        run: just check
