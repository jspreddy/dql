name: Changelog

# After each merge into v-rust, regenerate CHANGELOG.md. When it changed, open a pull request
# with the update and merge it. v-rust requires a pull request, so the bot cannot push to it.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests". The workflow only creates and merges its own pull request; it never approves one.
#
# The merge is made with the job token, and pushes made with it do not start workflows, so the
# changelog merge does not run this workflow again. changelog.py leaves "Update the changelog"
# merges out of the file, so that merge does not make it stale either.
on:
  push:
    branches: [v-rust]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One update at a time. A run that waits starts from the newer v-rust, so it covers both merges.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Plain git, no `uses:`, like check.yml. changelog.py walks the whole first-parent
      # history of origin/v-rust, so this fetch is not shallow.
      - name: Check out v-rust
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git init -q .
          git config http.extraheader "AUTHORIZATION: basic $auth"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q origin +refs/heads/v-rust:refs/remotes/origin/v-rust
          git checkout -q -B changelog origin/v-rust
          git log --oneline -1

      - name: Regenerate CHANGELOG.md
        id: regen
        run: |
          python3 .cursor/skills/changelog/changelog.py --ref origin/v-rust
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest merged pull request that is not itself a changelog update.
          last=$(git log --first-parent --merges --format='%s%x1f%b%x1e' origin/v-rust | python3 -c '
          import re, sys
          for record in sys.stdin.read().split("\x1e"):
              subject, _, body = record.strip("\n").partition("\x1f")
              number = re.match(r"Merge pull request #(\d+) ", subject)
              title = next((line.strip() for line in body.splitlines() if line.strip()), "")
              if number and not title.startswith("Update the changelog"):
                  print(number.group(1))
                  break
          ')
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "title=Update the changelog through #${last}" >> "$GITHUB_OUTPUT"

      - name: Open and merge the update
        if: steps.regen.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.regen.outputs.title }}
        run: |
          branch="bot/changelog-${GITHUB_SHA::7}"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$TITLE" -- CHANGELOG.md
          git push -q --force origin "HEAD:refs/heads/$branch"
          url=$(gh pr create --base v-rust --head "$branch" --title "$TITLE" \
            --body "Regenerated by the Changelog workflow after $GITHUB_SHA merged into v-rust.")
          echo "$url"
          # A new pull request can report "not mergeable" until GitHub has computed its merge.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$url" --merge --delete-branch && exit 0
            sleep $((attempt * 5))
          done
          echo "could not merge $url" >&2
          exit 1
