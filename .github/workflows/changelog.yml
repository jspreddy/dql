name: Changelog

# After each merge into v-rust, regenerate CHANGELOG.md. When it changed, open a pull request
# with the update and merge it. v-rust requires a pull request, so the bot cannot push to it.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests". The workflow only creates and merges its own pull request; it never approves one.
#
# The merge is made with the job token, and pushes made with it do not start workflows, so the
# changelog merge does not run this workflow again. scripts/changelog.py leaves "Update the changelog"
# merges out of the file, so that merge does not make it stale either.
on:
  push:
    branches: [v-rust]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One update at a time. A run that waits starts from the newer v-rust, so it covers both merges.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # GitHub's own checkout, pinned to a commit (the Actions policy requires pinned actions).
      # scripts/changelog.py walks the whole first-parent history of origin/v-rust, so fetch it all.
      # The checkout keeps the job token in .git/config (masked) for the push below.
      - name: Check out v-rust
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v-rust
          fetch-depth: 0

      - name: Start from the latest v-rust
        run: |
          git checkout -q -B changelog origin/v-rust
          git log --oneline -1

      - name: Regenerate CHANGELOG.md
        id: regen
        run: |
          python3 scripts/changelog.py --ref origin/v-rust
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(python3 scripts/changelog.py --ref origin/v-rust --commit-title)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Open and merge the update
        if: steps.regen.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.regen.outputs.title }}
        run: |
          branch="bot/changelog-${GITHUB_SHA::7}"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$TITLE" -- CHANGELOG.md
          git push -q --force origin "HEAD:refs/heads/$branch"
          url=$(gh pr create --base v-rust --head "$branch" --title "$TITLE" \
            --body "Regenerated by the Changelog workflow after $GITHUB_SHA merged into v-rust.")
          echo "$url"
          # A new pull request can report "not mergeable" until GitHub has computed its merge.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$url" --merge --delete-branch && exit 0
            sleep $((attempt * 5))
          done
          echo "could not merge $url" >&2
          exit 1
