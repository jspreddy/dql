<body>
  <header>
    <p class="kicker">dqlrs</p>
    <h1>How the Rust client is built</h1>
    <p>
      One Cargo workspace in <code>rust-impl/</code> produces the <code>dqlrs</code> binary.
      The same session and engine serve the REPL, <code>-c</code>, <code>--serve</code>, <code>--web</code>, and the notebook kernel.
    </p>
    <nav>
      <a href="#architecture">Architecture</a>
      <a href="#packages">Packages</a>
      <a href="#runtime">Runtime</a>
    </nav>
  </header>
