[project]
name = "dql-notebook"
version = "0.1.0"
description = "JupyterLab frontend and DQL kernels for dql and dqlrs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
dependencies = [
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29",
    "dql",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dql_notebook_kernel"]

[tool.uv]
package = true

[tool.uv.sources]
dql = { path = "../py-impl", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
