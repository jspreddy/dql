[package]
name = "dql-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "dqlrs"
path = "src/main.rs"

[features]
default = []
watch = ["dql-engine/cloudwatch"]

[dependencies]
clap.workspace = true
crossterm.workspace = true
dql-engine = { path = "../dql-engine" }
dql-models = { path = "../dql-models" }
dql-output = { path = "../dql-output" }
dql-parser = { path = "../dql-parser" }
glob.workspace = true
humansize.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile = "3.23.0"
