[package]
name = "dql-engine"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[features]
default = []
cloudwatch = ["dep:aws-sdk-cloudwatch"]

[dependencies]
aws-config = "1.8.18"
aws-credential-types = "1.2.14"
# Default features add the SDK's legacy `rustls` connector (hyper 0.14, rustls 0.21), which
# cargo audit flags. `default-https-client` is the client the SDK uses.
aws-sdk-cloudwatch = { version = "1.116.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.116.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts.workspace = true
dql-expr = { path = "../dql-expr" }
dql-models = { path = "../dql-models" }
dql-parser = { path = "../dql-parser" }
humansize.workspace = true
flate2 = "1"
glob.workspace = true
rmp = "0.8.15"
rmpv = "1.3.1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
