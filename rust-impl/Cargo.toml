[workspace]
members = [
    "crates/dql-cli",
    "crates/dql-engine",
    "crates/dql-expr",
    "crates/dql-models",
    "crates/dql-output",
    "crates/dql-parser",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.4-dev12"
description = "DynamoDB Query Language"
authors = ["Sai Jonnala <jspreddy@users.noreply.github.com>"]
repository = "https://github.com/jspreddy/dql"
homepage = "https://github.com/jspreddy/dql"
readme = "../rust-docs/README.md"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
aws-sdk-sts = "1.96.0"
clap = { version = "4.5.47", features = ["derive"] }
crossterm = "0.28.1"
glob = "0.3.3"
humansize = "2.1.3"
insta = "1.43.2"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.0"
