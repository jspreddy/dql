[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dql"
module-root = ""

[project]
name = "dql"
version = "0.6.4-dev12"
description = "DynamoDB Query Language"
authors = [{ name = "Steven Arcangeli", email = "stevearc@stevearc.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["aws", "dynamo", "dynamodb", "sql"]
dependencies = [
    "dynamo3>=1.0.0",
    "pyparsing==2.1.4",
    "python-dateutil",
    "botocore>=1.17.55",
    "rich>=6.1.1",
    "typing_extensions",
    "humanize>=4.0.0",
    "gnureadline>=8.2.13",
]
requires-python = ">=3.9,<3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-dynamodb",
    "bump2version",
    "numpydoc",
    "sphinx",
    "sphinx_rtd_theme",
    "tox",
    "wheel",
    "build",
    "isort",
    "mypy",
    "black==24.4.1",
    "pylint",
    "faker",
    "types-python-dateutil",
    "types-mock",
    "mock",
    "syrupy",
    "pex",
]

[project.urls]
Homepage = "http://github.com/stevearc/dql"

[project.scripts]
dql = "dql:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-dynamodb",
    "bump2version",
    "numpydoc",
    "sphinx",
    "sphinx_rtd_theme",
    "tox",
    "wheel",
    "build",
    "isort",
    "mypy",
    "black==24.4.1",
    "pylint",
    "faker",
    "types-python-dateutil",
    "types-mock",
    "mock",
    "syrupy",
    "pex",
    "taskipy>=1.14.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dql*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["README.rst", "CHANGES.rst"]

[tool.setuptools.exclude-package-data]
"*" = ["tests"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
ignore_whitespace = true

[tool.mypy]
ignore_missing_imports = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_reexport = true

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]

[tool.pytest-dynamodb]
dir = "./.dynamo-local/data"
port = 8000
delay = 2

[tool.taskipy.tasks]
bump = "sh ./scripts/bump-version.sh"
version = "which python && python --version"

clean = "rm -rf .dynamo-local build dql.egg-info .pytest_cache .coverage; uv venv --clear"
resync = "uv sync --dev --refresh --reinstall --no-cache"

# Test scripts
test = "pytest tests"
test-verbose = "pytest --verbose tests"
test-specific = "pytest"

# Linting and formatting scripts
lint = "task lint-mypy && task lint-isort && task lint-black && task lint-pylint"

lint-mypy = "mypy dql tests bin/install.py"
lint-isort = "isort --skip snapshots --check dql tests bin/install.py"
lint-black = "black --exclude=snapshots --check dql tests bin/install.py"
lint-pylint = "pylint --rcfile=.pylintrc dql tests bin/install.py"

fix = "task fix-isort && task fix-black"

fix-isort = "isort --skip snapshots --atomic dql tests bin/install.py"
fix-black = "black --exclude=snapshots dql tests bin/install.py"

# Coverage scripts
coverage = "pytest --cov=dql --cov-report=html --cov-branch tests"
coverage-ci = "pytest --cov=dql --cov-report=html --cov-branch tests"

# Package building script
package = "task version && uv build --verbose && uv run pex . -m dql:main -o build/dql"

dynamo = "sh ./scripts/install_dynamodb_local.sh"
