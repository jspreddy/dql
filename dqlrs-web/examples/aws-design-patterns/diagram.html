<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS design patterns</title>
  <style>
    body {
      margin: 0;
      background: #f3efe6;
      color: #1c1915;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
    .kicker {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
      color: #5e564c;
    }
    a { color: #9a3412; }
    figure {
      background: #fffdf8;
      border: 1px solid #d9cdb8;
      padding: 16px 16px 8px;
      margin: 24px 0;
    }
    figcaption h2 {
      margin: 0 0 8px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
    }
    figcaption p, .note {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #5e564c;
      font-size: 14px;
    }
    pre.mermaid { margin: 0; background: transparent; }
    .mermaid svg { max-width: 100%; height: auto; }
    
  </style>
</head>
<body>
<main>
  <p class="kicker">Examples</p>
  <h1>AWS design patterns</h1>
  <p>Three single-table designs from the <a href="https://github.com/aws-samples/amazon-dynamodb-design-patterns">amazon-dynamodb-design-patterns</a> sample.</p>
  <figure id="model">
    <figcaption>
      <h2>The three examples</h2>
      <p>The branches are the examples in this folder.</p>
    </figcaption>
    <pre class="mermaid">

mindmap
  root((Patterns))
    Online shop
      Customers and orders
      Warehouses and stock
    Device state log
      Logs by state
      Operator index
      Escalations
    Version control
      Time based
      Number based

    </pre>
  </figure>
  <p class="note"><a href="README.md">Data model notes</a></p>
</main>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';

  const pre = document.querySelector('#model pre.mermaid');
  const source = pre.textContent;
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  await mermaid.run();

</script>
</body>
</html>
