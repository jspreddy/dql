<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time-based versions</title>
  <style>
    body {
      margin: 0;
      background: #f3efe6;
      color: #1c1915;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    main { max-width: 920px; margin: 0 auto; padding: 32px 20px 64px; }
    .kicker {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
      color: #5e564c;
    }
    a { color: #9a3412; }
    figure {
      background: #fffdf8;
      border: 1px solid #d9cdb8;
      padding: 16px 16px 8px;
      margin: 24px 0;
    }
    figcaption h2 {
      margin: 0 0 8px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
    }
    figcaption p, .note {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #5e564c;
      font-size: 14px;
    }
    pre.mermaid { margin: 0; background: transparent; }
    .mermaid svg { max-width: 100%; height: auto; }
    
#model svg .node { cursor: pointer; }
#model svg.chain .node,
#model svg.chain path.flowchart-link,
#model svg.chain .edgeLabel {
  opacity: 0.14;
  transition: opacity 120ms ease;
}
#model svg.chain .node.hot,
#model svg.chain path.flowchart-link.hot,
#model svg.chain .edgeLabel.hot { opacity: 1; }
#model svg.chain path.flowchart-link.hot { stroke: #9a3412; }
#model svg .node.pinned > rect {
  fill: #9a3412 !important;
  stroke: #7c2d12 !important;
  stroke-width: 3px;
}
#model svg .node.pinned .nodeLabel { color: #fffdf8 !important; }
@media (prefers-reduced-motion: reduce) {
  #model svg.chain .node,
  #model svg.chain path.flowchart-link,
  #model svg.chain .edgeLabel { transition: none; }
}

  </style>
</head>
<body>
<main>
  <p class="kicker">Data model</p>
  <h1>Time-based versions</h1>
  <p>Each state is a new row whose sort key is the time it was recorded. From the <a href="https://github.com/aws-samples/amazon-dynamodb-design-patterns/tree/master/examples/version-control/time-based-version">AWS time-based version example</a>.</p>
  <figure id="model">
    <figcaption>
      <h2>Metadata and states in time order</h2>
      <p>Hover a box to follow the rows it connects. Click a box to pin that chain, click it again to clear.</p>
    </figcaption>
    <pre class="mermaid">

flowchart TD
  equipment["Equipment"]
  metadata["Metadata"]
  earlier["Earlier state"]
  later["Later state"]
  latest["Latest state"]
  equipment --> metadata
  equipment --> earlier
  earlier --> later
  later --> latest

    </pre>
  </figure>
  <p class="note"><a href="README.md">Data model notes</a></p>
</main>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';

  const pre = document.querySelector('#model pre.mermaid');
  const source = pre.textContent;
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  await mermaid.run();
  highlightCallChain(document.querySelector('#model svg'), source);

function highlightCallChain(svg, source) {
  const edges = [];
  for (const line of source.split('\n')) {
    const match = line.match(/^\s*(\w+)\s+-->\s*(?:\|[^|]*\|\s*)?(\w+)/);
    if (match) edges.push([match[1], match[2]]);
  }
  const nodeEls = new Map();
  for (const node of svg.querySelectorAll('g.node')) {
    const match = node.id.match(/-flowchart-(.+)-\d+$/);
    if (match) nodeEls.set(match[1], node);
  }
  const outgoing = new Map();
  const incoming = new Map();
  for (const id of nodeEls.keys()) {
    outgoing.set(id, []);
    incoming.set(id, []);
  }
  const edgeEls = edges.map(([from, to]) => {
    outgoing.get(from)?.push(to);
    incoming.get(to)?.push(from);
    const marker = `L_${from}_${to}_`;
    return {
      from,
      to,
      path: [...svg.querySelectorAll('path.flowchart-link')].find((path) => path.id.includes(marker)),
      label: svg.querySelector(`.edgeLabel .label[data-id^="${marker}"]`)?.closest('.edgeLabel')
    };
  });

  function walk(start, neighbors) {
    const seen = new Set();
    const stack = [...(neighbors.get(start) || [])];
    while (stack.length) {
      const id = stack.pop();
      if (seen.has(id)) continue;
      seen.add(id);
      stack.push(...(neighbors.get(id) || []));
    }
    return seen;
  }

  function clear() {
    svg.classList.remove('chain');
    for (const el of svg.querySelectorAll('.hot, .pinned')) {
      el.classList.remove('hot');
      el.classList.remove('pinned');
    }
  }

  let pinned = null;

  function nodeIdFrom(event) {
    const node = event.target.closest('g.node');
    if (!node) return null;
    const match = node.id.match(/-flowchart-(.+)-\d+$/);
    return match ? match[1] : null;
  }

  function show(id) {
    if (!nodeEls.has(id)) return;
    clear();
    const hot = walk(id, incoming);
    for (const next of walk(id, outgoing)) hot.add(next);
    hot.add(id);
    svg.classList.add('chain');
    for (const nodeId of hot) nodeEls.get(nodeId)?.classList.add('hot');
    if (pinned) nodeEls.get(pinned)?.classList.add('pinned');
    for (const edge of edgeEls) {
      if (!hot.has(edge.from) || !hot.has(edge.to)) continue;
      edge.path?.classList.add('hot');
      edge.label?.classList.add('hot');
    }
  }

  svg.addEventListener('mouseover', (event) => {
    if (pinned) return;
    const id = nodeIdFrom(event);
    if (id) show(id);
  });
  svg.addEventListener('mouseleave', () => {
    if (!pinned) clear();
  });
  svg.addEventListener('click', (event) => {
    const id = nodeIdFrom(event);
    if (!id) return;
    pinned = pinned === id ? null : id;
    if (pinned) show(pinned);
    else show(id);
  });
}

</script>
</body>
</html>
