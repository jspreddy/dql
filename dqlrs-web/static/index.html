<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dqlrs</title>
  <script>
    try {
      if (localStorage.getItem("dqlrs-web.theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/app.css" />
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state": "/vendor/codemirror-state.js",
      "@codemirror/view": "/vendor/codemirror-view.js",
      "@codemirror/language": "/vendor/codemirror-language.js",
      "@codemirror/commands": "/vendor/codemirror-commands.js",
      "@codemirror/streamparser": "/vendor/streamparser.js",
      "@lezer/common": "/vendor/lezer-common.js",
      "@lezer/highlight": "/vendor/lezer-highlight.js",
      "@marijn/find-cluster-break": "/vendor/find-cluster-break.js",
      "crelt": "/vendor/crelt.js",
      "style-mod": "/vendor/style-mod.js",
      "w3c-keyname": "/vendor/w3c-keyname.js"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand-mark">
      <div class="brand">DQLRS Web</div>
    </div>
    <div class="modes" role="tablist">
      <button type="button" id="mode-query" class="active" role="tab" aria-selected="true">Query</button>
      <button type="button" id="mode-tables" role="tab" aria-selected="false">Tables</button>
    </div>
    <div class="title-search">
      <input id="title-search" type="search" placeholder="Search tables, columns, queries" spellcheck="false" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="title-search-list" aria-label="Search tables, columns, and queries" />
      <div id="title-search-list" class="title-search-list" role="listbox" hidden></div>
    </div>
    <div class="header-tools">
      <div id="presence" class="presence" role="list" aria-label="Connected clients"></div>
      <div class="header-toggles">
        <button type="button" id="settings-toggle" class="theme-toggle" popovertarget="settings-pop" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-pop" aria-label="Settings" title="Settings">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M2.2 4.2h11.6M2.2 8h11.6M2.2 11.8h11.6"/>
            <circle cx="6" cy="4.2" r="1.45" fill="var(--bar)" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="10.4" cy="8" r="1.45" fill="var(--bar)" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="5.2" cy="11.8" r="1.45" fill="var(--bar)" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="theme-moon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M9.6 1.4a6.2 6.2 0 1 0 5 9.6 5 5 0 0 1-5-9.6Z"/>
          </svg>
          <svg class="theme-sun" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/>
          </svg>
        </button>
      </div>
      <button type="button" class="endpoint" id="endpoint" data-kind="local">localhost:8000</button>
    </div>
    <div id="settings-pop" class="settings-pop" popover="auto" aria-label="Settings">
      <span class="settings-label">Highlight</span>
      <label><input type="checkbox" id="opt-minimal-write" /> Minimal write highlight</label>
      <label><input type="checkbox" id="opt-even-odd" checked /> Even/odd highlight</label>
      <hr class="settings-rule" />
      <div class="settings-cache-head">
        <span class="settings-label">Table cache</span>
        <span id="settings-cache-age" class="settings-cache-age">not cached</span>
      </div>
      <button type="button" id="clear-table-cache">Clear table cache</button>
      <p id="cache-clear-note" class="settings-note" hidden></p>
    </div>
    <div id="env-pop" class="env-pop" popover="auto" aria-labelledby="env-pop-title"></div>
  </header>
  <div class="body">
    <aside class="side" id="side">
      <div class="side-head">
        <span class="side-heading">
          <span id="side-title">Files</span>
          <button type="button" id="refresh-tables" class="hidden" title="Refresh the cached table list in the background" aria-label="Refresh cached tables">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3"/>
              <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M13.4 2.2v3.1H10.3"/>
            </svg>
          </button>
          <span id="table-cache" class="table-cache hidden" tabindex="0">
            <span class="table-cache-age"></span>
            <span class="table-cache-tip" role="tooltip"></span>
          </span>
        </span>
        <button type="button" id="new-file" title="New .dql file">+</button>
      </div>
      <div id="tree" class="tree"></div>
      <div id="tables-nav" class="tables-nav hidden">
        <div class="search-row">
          <input id="table-search" type="search" placeholder="catalog" spellcheck="false" aria-label="Filter tables" title="Same matching as ls. A glob lists those tables. Otherwise similar names and related keys." />
        </div>
        <div id="table-list" class="table-list"></div>
      </div>
      <div id="side-resize" class="side-resize" role="separator" aria-orientation="vertical" aria-label="Resize navigation" title="Drag to resize the left nav" tabindex="0">
        <span class="side-grip" aria-hidden="true"></span>
      </div>
    </aside>
    <div id="file-menu" class="menu" role="menu" hidden></div>
    <main>
      <section id="query-view" class="view">
        <div class="pane-head">
          <span class="file-name-row">
            <span id="file-name">No file open</span>
            <button type="button" id="patch-recall" class="patch-recall hidden">Unsaved patch</button>
            <button type="button" id="lint-status" class="lint-status hidden" aria-live="polite"></button>
            <button type="button" id="run-file" class="hidden" title="Run this file">
              <svg class="ff-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M1.6 3.1 7.2 8 1.6 12.9Zm6.8 0L14 8 8.4 12.9Z"/>
              </svg>
              Run file
            </button>
          </span>
          <div class="run-box">
            <button type="button" id="run" class="primary" aria-label="Run selection">
              <svg class="run-play" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M5.2 3.1 12.4 8 5.2 12.9Z"/>
              </svg>
              <span id="run-shortcut" class="run-shortcut"><span class="run-mod">Ctrl</span> + Enter</span>
            </button>
            <button type="button" id="stop" class="stop hidden">Stop</button>
          </div>
        </div>
        <div class="editor">
          <div id="editor"></div>
        </div>
        <section class="results" id="results">
          <div class="results-bar">
            <div id="results-resize" class="results-resize" role="separator" aria-orientation="horizontal" aria-label="Resize results" title="Drag to resize results" tabindex="0">
              <span class="results-grip" aria-hidden="true"></span>
            </div>
            <div class="pane-head results-head">
              <div class="results-title">
                <span class="results-mark" aria-hidden="true"></span>
                <div class="result-tabs" role="tablist" aria-label="Result pane">
                  <button type="button" class="result-tab is-active" role="tab" id="result-tab-result" data-pane="result" aria-selected="true" aria-controls="result-body">Result</button>
                  <button type="button" class="result-tab" role="tab" id="result-tab-history" data-pane="history" aria-selected="false" aria-controls="result-body">History</button>
                  <button type="button" class="result-tab" role="tab" id="result-tab-lint" data-pane="lint" aria-selected="false" aria-controls="result-body">Lint</button>
                </div>
                <progress id="run-progress" hidden aria-label="Query progress"></progress>
              </div>
              <span class="results-actions">
                <span id="result-meta" class="meta"></span>
                <span class="results-chip">
                  <span id="result-count">0 results</span>
                  <button type="button" id="clear-results" class="hidden" aria-label="Clear results" title="Clear results">
                    <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
                      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M2.8 4.2h10.4M6.1 4.1V2.8h3.8v1.3M4.3 4.2l.7 9h6l.7-9M6.7 6.5v4.2M9.3 6.5v4.2"/>
                    </svg>
                  </button>
                </span>
              </span>
            </div>
          </div>
          <div id="result-body" class="result-body" role="tabpanel" aria-labelledby="result-tab-result"></div>
        </section>
      </section>
      <section id="tables-view" class="view hidden">
        <div class="rows-head">
          <span class="rows-heading">
            <span id="rows-title"></span>
            <button type="button" id="rows-schema" class="schema-btn hidden" title="Show table structure" aria-label="Show table structure" aria-haspopup="dialog" aria-controls="schema-pop" aria-expanded="false">
              <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M2.5 3.2h11v9.6h-11z"/>
                <path fill="none" stroke="currentColor" stroke-width="1.4" d="M2.5 6.4h11M6.7 3.2v9.6"/>
              </svg>
            </button>
          </span>
          <span id="rows-meta" class="meta"></span>
        </div>
        <div id="rows-body" class="result-body"></div>
        <div class="pager">
          <span id="page-label" class="meta"></span>
          <span>
            <button type="button" id="page-prev">Previous</button>
            <button type="button" id="page-next">Next</button>
          </span>
        </div>
      </section>
    </main>
  </div>
  <dialog id="schema-pop" aria-labelledby="schema-pop-title">
    <div class="schema-pop-card">
      <header class="schema-pop-head">
        <div class="schema-pop-heading">
          <div class="schema-pop-kicker-row">
            <span id="schema-pop-kicker" class="schema-pop-kicker"></span>
            <button type="button" id="schema-pop-info" class="schema-pop-info hidden" title="Based on this query result, not the entire table." aria-label="Based on this query result, not the entire table.">
              <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                <circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M7 6.3v3.4M7 4.4v.2"/>
              </svg>
            </button>
          </div>
          <div class="schema-pop-title-row">
            <h2 id="schema-pop-title">Structure</h2>
            <div id="schema-pop-keys" class="schema-pop-keys"></div>
          </div>
          <div id="schema-pop-query" class="schema-pop-query" hidden></div>
          <p id="schema-pop-summary" class="schema-pop-summary"></p>
        </div>
        <button type="button" id="schema-pop-close" title="Close" aria-label="Close structure">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M2 2l8 8M10 2l-8 8"/>
          </svg>
        </button>
      </header>
      <div id="schema-pop-body" class="schema-pop-body"></div>
      <p id="schema-pop-foot" class="schema-pop-foot"></p>
    </div>
  </dialog>
  <dialog id="row-pop" aria-labelledby="row-pop-title">
    <div class="row-pop-card">
      <header class="row-pop-head">
        <div class="row-pop-heading">
          <span class="row-pop-kicker">Row</span>
          <h2 id="row-pop-title">Row</h2>
          <div id="row-pop-keys" class="row-pop-keys"></div>
        </div>
        <button type="button" id="row-pop-close" title="Close" aria-label="Close row">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M2 2l8 8M10 2l-8 8"/>
          </svg>
        </button>
      </header>
      <div id="row-pop-body" class="row-pop-body"></div>
    </div>
  </dialog>
  <div id="complete-list" class="complete-list" role="listbox" aria-label="Suggestions" hidden></div>
  <dialog id="patch-pop" aria-labelledby="patch-pop-title">
    <div class="patch-pop-card">
      <header class="patch-pop-head">
        <h2 id="patch-pop-title">File changed on disk</h2>
        <button type="button" id="patch-pop-close" title="Close" aria-label="Close unsaved patch">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M2 2l8 8M10 2l-8 8"/>
          </svg>
        </button>
      </header>
      <p id="patch-pop-note"></p>
      <pre id="patch-pop-body"></pre>
      <div class="patch-pop-nav">
        <button type="button" id="patch-prev">Previous</button>
        <span id="patch-count"></span>
        <button type="button" id="patch-next">Next</button>
      </div>
      <div class="patch-pop-actions">
        <button type="button" id="patch-copy">Copy patch</button>
      </div>
    </div>
  </dialog>
  <dialog id="server-pop" aria-labelledby="server-pop-title">
    <div class="server-pop-card">
      <h2 id="server-pop-title">The server went away</h2>
      <p id="server-pop-status" class="server-pop-status"></p>
      <button type="button" id="server-retry">Retry</button>
    </div>
  </dialog>
  <div id="lint-tip" class="lint-tip" role="tooltip" hidden></div>
  <div id="run-tip" class="run-tip" role="tooltip" hidden>Run selection</div>
  <script type="module" src="/app.js"></script>
</body>
</html>
